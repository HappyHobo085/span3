services:
  db:
    image: postgres:15
    container_name: moon_db
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    build: ./Backend
    container_name: moon_backend
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  webwerf-frontend:
    image: nginx:alpine
    container_name: webwerf_frontend
    ports:
      - "80:80"
    volumes:
      - ./Webwerf:/usr/share/nginx/html:ro
      - ./Webwerf/assets:/usr/share/nginx/assets:ro
      - ./Webwerf/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
