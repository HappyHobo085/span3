services:
  db:
    image: postgres:15
    container_name: moon_db
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    container_name: moon_backend
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      # Span-toetsing: sit op 0 of verwyder vir regte JWT- / rolbeveiliging
      - DISABLE_AUTH=0
    depends_on:
      db:
        condition: service_healthy

  webwerf-frontend:
    image: nginx:alpine
    container_name: webwerf_frontend
    ports:
      - "80:80"
    volumes:
      - ./Webwerf:/usr/share/nginx/html:ro
      - ./Webwerf/assets:/usr/share/nginx/assets:ro
      - ./Webwerf/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always

volumes:
  postgres_data:
