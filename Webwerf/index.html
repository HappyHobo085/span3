<!DOCTYPE html>
<!--
  Webwerf — landing / redirect page.
  Sends the browser to login.html immediately so users never stay on this empty page.
  Two methods are used: meta refresh (works even if JavaScript is off) and script (faster in many browsers).
-->
<html>

<head>
    <!-- SPAN-TOETSING: vroeër login.html — herstel vir produksie -->
    <meta http-equiv="refresh" content="0; url=home.html">
    <script type="text/javascript">
        window.location.href = "home.html";
    </script>
    <title>Redirecting...</title>
</head>

<body>
    If you are not redirected, <a href="home.html">click here for home</a>.
</body>

</html>
