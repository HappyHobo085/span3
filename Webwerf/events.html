<!DOCTYPE html>
<!--
  events.html — Events-blad: wys die gebeure (events) van die bediener af —
  komende of voriges — met 'n soekveld. Klik op 'n event om regs sy gastelys
  te sien: wie genooi is (RSVP's en eksterne gaste), wie hier is en wie al
  vertrek het. Die logika sit in event.js.
-->
<html lang="af">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261007verslag">
  <script src="theme.js?v=20260819"></script>
</head>
<body>
  <!-- Gedeelde raamwerk: sybalk + boonste balk -->
  <div id="site-header"></div>

  <main class="page" id="events-page">
    <!-- Boonste beheer: kies watter events om te sien, en soek -->
    <section class="top-controls space-between" aria-label="Opsies">
      <div class="control-group">
        <label class="field-label" for="events-view">Wys</label>
        <select class="glass-select" id="events-view" style="width:200px">
          <option value="komende">Komende events</option>
          <option value="vorige">Vorige events</option>
        </select>
      </div>
      <div class="control-group" style="min-width:240px">
        <label class="field-label" for="list-search">Soek</label>
        <input class="glass-input" type="search" id="list-search"
               aria-label="Soek event" placeholder="Soek event of plek...">
      </div>
    </section>

    <!-- Twee panele: links die events (klik een), regs die gekose event se gaste -->
    <section class="panels">
      <!-- Links: die lys van events -->
      <article class="glass-card panel" aria-label="Events">
        <h2 id="events-titel">Events</h2>
        <div id="events-lys" class="admin-list" aria-label="Events lys"></div>
      </article>

      <!-- Regs: die gekose event en sy gastelys (GET /events/{id}/rsvps) -->
      <article class="glass-card panel" aria-label="Gaste van die gekose event">
        <h2 id="gaste-titel">Gaste</h2>

        <!-- Die gekose event se besonderhede -->
        <div class="event-kop" id="event-kop" hidden>
          <div class="event-kop-ry">
            <div class="event-kop-naam" id="event-naam">--</div>
            <span class="live-chip" id="event-nou" hidden><span class="live-dot" aria-hidden="true"></span>Nou aan die gang</span>
          </div>
          <div class="event-kop-detail" id="event-detail">--</div>
          <p class="event-kop-beskrywing" id="event-beskrywing" hidden></p>
        </div>

        <!-- Opsomming: hoeveel gaste hier is, vertrek het en nog nie aangekom het nie -->
        <div class="card wide viz-block" id="gaste-stats-card" hidden>
          <div id="stat-gaste-split"></div>
          <div class="viz-caption" id="gaste-caption"></div>
        </div>

        <!-- Filter en soek in die gastelys -->
        <div class="list-search gaste-filters" id="gaste-filters" hidden>
          <input class="glass-input" type="search" id="gaste-search"
                 aria-label="Soek gas" placeholder="Soek gas..." style="flex:1">
          <select class="glass-select" id="gaste-filter" aria-label="Filter volgens status" style="width:170px">
            <option value="ALMAL">Almal</option>
            <option value="HIER">Hier</option>
            <option value="VERTREK">Vertrek</option>
            <option value="NIE">Nog nie aangekom</option>
            <option value="ONBEKEND">Eksterne gaste</option>
          </select>
        </div>

        <!-- Die gastelys: elke gas met rol, nommer en sy/haar status -->
        <div id="gaste-lys" class="admin-list" aria-label="Gastelys"></div>
      </article>
    </section>
  </main>

  <!-- Skripte: main.js (aanmelding en API) en event.js (hierdie blad se logika) -->
  <script src="website_api_calls.js?v=20261007verslag"></script>
  <script src="main.js?v=20261007verslag"></script>
  <script src="stats.js?v=20260902"></script>
  <script src="event.js?v=20260903"></script>
</body>
</html>
