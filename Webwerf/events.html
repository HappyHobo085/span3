<!DOCTYPE html>
<!--
  events.html — Events-blad: wys die besonderhede van gebeure (events)
  en 'n lys waarin 'n mens vir 'n student kan soek.
-->
<html lang="en">
<!-- Kop: die blad se titel, lettertipes en styl-lêer -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260818c">
  <script src="theme.js"></script>
</head>
<body>
  <!-- Shared header placeholder -->
  <div id="site-header"></div>

  <!-- Hoofinhoud van die events-blad -->
  <main class="page" id="home-page">
    <section class="panels">
      <!-- Paneel met die besonderhede van die gebeure -->
      <article class="glass-card panel" aria-label="Events Details">
        <h2>Events Details</h2>
      </article>

      <!-- Paneel met die lys en 'n soek-veld om 'n student te vind -->
      <article class="glass-card panel" aria-label="Lys">
        <h2>Lys</h2>
        <div class="list-search">
          <input class="glass-input" type="search" id="list-search"
                 aria-label="Soek in Lys" placeholder="Soek student...">
        </div>
        <ul id="data-list" class="empty-list" aria-label="Leë data lys"></ul>
      </article>
    </section>
  </main>

  <!-- Terug-knoppie onderaan die blad: stuur die gebruiker terug na die tuisblad -->
  <div class="action-bar">
    <button class="btn-outline" type="button"
            onclick="window.location.href='home.html'">← Terug</button>
  </div>

  <!-- Skrip: laat die soek-veld werk sodat die lys gefiltreer kan word -->
  <script>
    // Hierdie funksie begin dadelik en maak die soek-veld reg
    (function () {
      const listSearch = document.getElementById('list-search');
      const dataList   = document.getElementById('data-list');
      // Hierdie funksie steek lys-items weg wat nie by die soekwoord pas nie
      function applyListFilter() {
        if (!listSearch || !dataList) return;
        const query = listSearch.value.trim().toLowerCase();
        dataList.querySelectorAll('li').forEach((li) => {
          li.hidden = query !== '' && !(li.textContent || '').trim().toLowerCase().includes(query);
        });
      }
      // Elke keer as die gebruiker in die soek-veld tik, word die lys weer gefiltreer
      if (listSearch) listSearch.addEventListener('input', applyListFilter);
    })();
  </script>
  <!-- Skrip: kyk of die gebruiker ingeteken is -->
  <script src="main.js"></script>
</body>
</html>
