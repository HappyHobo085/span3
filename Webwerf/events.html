<!DOCTYPE html>
<!--
  events.html — Events-blad: wys die gebeure (events) van die bediener af —
  komende, myne of voriges — met 'n soekveld. Die logika sit in event.js.
-->
<html lang="af">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260903c">
  <script src="theme.js?v=20260819"></script>
</head>
<body>
  <!-- Gedeelde raamwerk: sybalk + boonste balk -->
  <div id="site-header"></div>

  <main class="page" id="events-page">
    <!-- Boonste beheer: kies watter events om te sien, en soek -->
    <section class="top-controls space-between" aria-label="Opsies">
      <div class="control-group">
        <label class="field-label" for="events-view">Wys</label>
        <select class="glass-select" id="events-view" style="width:200px">
          <option value="komende">Komende events</option>
          <option value="vorige">Vorige events</option>
        </select>
      </div>
      <div class="control-group" style="min-width:240px">
        <label class="field-label" for="list-search">Soek</label>
        <input class="glass-input" type="search" id="list-search"
               aria-label="Soek event" placeholder="Soek event of plek...">
      </div>
    </section>

    <!-- Die lys van events -->
    <section class="glass-card panel" aria-label="Events">
      <h2 id="events-titel">Events</h2>
      <div id="events-lys" aria-label="Events lys"></div>
    </section>
  </main>

  <!-- Skripte: main.js (aanmelding en API) en event.js (hierdie blad se logika) -->
  <script src="main.js?v=20260819"></script>
  <script src="event.js?v=20260819"></script>
</body>
</html>
