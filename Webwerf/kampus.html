<!-- kampus.html — Die Kampus-bladsy. Wys wie tans op die kampus is (studente en personeel) en lyste wat mens kan deursoek. -->
<!DOCTYPE html>
<html lang="en">
<!-- Kop van die bladsy: titel, lettertipes en stylblad -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Kampus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigasiebalk: skakels na die ander bladsye van die webwerf -->
  <nav class="navbar">
    <a href="home.html" class="navbar-logo" aria-label="MOON">MOON</a>
    <a href="home.html">Tuis</a>
    <a href="kampus.html" class="active">Kampus</a>
    <a href="koshuis.html">Koshuis</a>
    <a href="events.html">Events</a>
  </nav>

  <!-- Hoofdeel van die bladsy -->
  <main class="page" id="home-page">
    <!-- Boonste beheer: keuselys om 'n kampus te kies -->
    <section class="top-controls space-between" aria-label="Opsies">
      <div class="control-group">
        <label class="field-label" for="data-select">Kies Kampus</label>
        <select class="glass-select" id="data-select" name="data-select" style="width:220px">
          <option value="Leriba">Leriba</option>
          <option value="Peerl">Peerl</option>
          <option value="Gerhard">Gerhard</option>
        </select>
      </div>
    </section>

    <!-- Twee panele langs mekaar: paneelbord links, lyste regs -->
    <section class="panels">
      <!-- Linkerkant: paneelbord met tellings en naamlyste (word deur kampus.js ingevul) -->
      <article class="glass-card panel" aria-label="Dashboard">
        <h2>Dashboard</h2>
        <div class="dashboard-grid">
          <!-- Statistieke: in/uit-verdelings en regstreekse tendens (stats.js) -->
          <div class="card wide viz-block" id="dash-stats-card">
            <strong>Statistieke</strong>
            <div id="stat-studente-split"></div>
            <div id="stat-personeel-split"></div>
            <div>
              <div class="viz-chart-title">Op kampus oor tyd (regstreeks)</div>
              <div id="stat-trend" class="viz-chart"></div>
            </div>
          </div>
          <!-- Lys van studente wat tans op die kampus is -->
          <div class="card wide" id="dash-student-in-card" style="flex-direction:column;align-items:stretch">
            <strong>Studente tans op kampus</strong>
            <div id="dash-student-in-list" class="admin-list" style="margin-top:8px"></div>
          </div>
          <!-- Lys van studente wat nie op die kampus is nie -->
          <div class="card wide" id="dash-student-out-card" style="flex-direction:column;align-items:stretch">
            <strong>Studente nie op kampus</strong>
            <div id="dash-student-out-list" class="admin-list" style="margin-top:8px"></div>
          </div>
          <!-- Lys van personeel wat tans op die kampus is -->
          <div class="card wide" id="dash-personeel-in-card" style="flex-direction:column;align-items:stretch">
            <strong>Personeel tans op kampus</strong>
            <div id="dash-personeel-in-list" class="admin-list" style="margin-top:8px"></div>
          </div>
          <!-- Lys van personeel wat nie op die kampus is nie -->
          <div class="card wide" id="dash-personeel-out-card" style="flex-direction:column;align-items:stretch">
            <strong>Personeel nie op kampus</strong>
            <div id="dash-personeel-out-list" class="admin-list" style="margin-top:8px"></div>
          </div>
        </div>
      </article>

      <!-- Regterkant: lyste van studente en personeel met soekblokkies -->
      <article class="glass-card panel" aria-label="Lys">
        <h2>Lys</h2>
        <!-- Soekblokkie vir die studente-lys -->
        <div class="list-search">
          <input class="glass-input" type="search" id="list-search"
                 aria-label="Soek in Lys" placeholder="Soek student...">
        </div>
        <!-- Hier word al die studente se kaartjies gewys -->
        <div id="data-list" class="admin-list" aria-label="Student lys"></div>

        <!-- Soekblokkie vir die personeel-lys -->
        <div class="list-search list-search--spaced">
          <input class="glass-input" type="search" id="bottom-search"
                 aria-label="Soek dosent" placeholder="Soek dosent...">
        </div>
        <!-- Hier word al die personeel se kaartjies gewys -->
        <div id="personeel-list" class="admin-list" aria-label="Personeel lys"></div>
      </article>
    </section>
  </main>

  <!-- Onderste balk met 'n knoppie om terug te gaan na die tuisblad -->
  <div class="action-bar">
    <button class="btn-outline" type="button"
            onclick="window.location.href='home.html'">← Terug</button>
  </div>

  <!-- Skripte: die kode wat die bladsy laat werk (laai in hierdie volgorde) -->
  <script src="website_api_calls.js"></script>
  <script src="main.js"></script>
  <script src="stats.js"></script>
  <script src="kampus.js"></script>
</body>
</html>
