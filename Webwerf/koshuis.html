<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Koshuis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="home.html" class="navbar-logo" aria-label="MOON">MOON</a>
    <a href="home.html">Tuis</a>
    <a href="kampus.html">Kampus</a>
    <a href="koshuis.html" class="active">Koshuis</a>
    <a href="events.html">Events</a>
  </nav>

  <main class="page" id="home-page">
    <section class="top-controls" aria-label="Opsies">
      <div class="control-group">
        <label class="field-label" for="data-select">Kies Koshuis</label>
        <select class="glass-select" id="data-select" name="data-select" style="width:220px"></select>
      </div>
    </section>

    <!-- Two-panel layout -->
    <section class="panels">
      <!-- Left: live dashboard -->
      <article class="glass-card panel" aria-label="Dashboard">
        <h2>Dashboard</h2>
        <div class="dashboard-grid">
          <div class="card" id="dash-student-in-count">Studente ingeteken: --</div>
          <div class="card" id="dash-student-out-count">Studente uitgeteken: --</div>
          <div class="card wide" id="dash-kapasiteit-card">Inwoners: -- / --</div>
          <div class="card wide" id="dash-student-in-card" style="flex-direction:column;align-items:stretch">
            <strong>Studente tans ingeteken</strong>
            <div id="dash-student-in-list" class="admin-list" style="margin-top:8px"></div>
          </div>
          <div class="card wide" id="dash-student-out-card" style="flex-direction:column;align-items:stretch">
            <strong>Studente uitgeteken</strong>
            <div id="dash-student-out-list" class="admin-list" style="margin-top:8px"></div>
          </div>
        </div>
      </article>

      <!-- Right: searchable list of the koshuis se studente -->
      <article class="glass-card panel" aria-label="Lys">
        <h2>Lys</h2>
        <div class="list-search">
          <input class="glass-input" type="search" id="list-search"
                 aria-label="Soek in Lys" placeholder="Soek student...">
        </div>
        <div id="data-list" class="admin-list" aria-label="Student lys"></div>
      </article>
    </section>
  </main>

  <div class="action-bar">
    <button class="btn-outline" type="button"
            onclick="window.location.href='home.html'">← Terug</button>
  </div>

  <script src="website_api_calls.js"></script>
  <script src="main.js"></script>
  <script src="koshuis.js"></script>
</body>
</html>
