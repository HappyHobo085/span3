<!-- koshuis.html — Die Koshuis-bladsy. Wys wie tans by die koshuis in- en uitgeteken is, hoeveel inwoners daar is, en 'n soekbare lys van die koshuis se studente. -->
<!DOCTYPE html>
<html lang="en">
<!-- Kop van die bladsy: titel, lettertipes en stylblad -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Koshuis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shared header placeholder -->
  <div id="site-header"></div>

  <!-- Hoofdeel van die bladsy -->
  <main class="page" id="home-page">
    <!-- Boonste beheer: keuselys om 'n koshuis te kies (word deur koshuis.js ingevul) -->
    <section class="top-controls" aria-label="Opsies">
      <div class="control-group">
        <label class="field-label" for="data-select">Kies Koshuis</label>
        <select class="glass-select" id="data-select" name="data-select" style="width:220px"></select>
      </div>
    </section>

    <!-- Twee panele langs mekaar: paneelbord links, studente-lys regs -->
    <section class="panels">
      <!-- Linkerkant: paneelbord met tellings en naamlyste (word deur koshuis.js ingevul) -->
      <article class="glass-card panel" aria-label="Dashboard">
        <h2>Dashboard</h2>
        <div class="dashboard-grid">
          <!-- Statistieke: kapasiteit-meter, in/uit-verdeling en regstreekse tendens (stats.js) -->
          <div class="card wide viz-block" id="dash-stats-card">
            <strong>Statistieke</strong>
            <div id="stat-kapasiteit-meter"></div>
            <div id="stat-inuit-split"></div>
            <div>
              <div class="viz-chart-title">Studente ingeteken oor tyd (regstreeks)</div>
              <div id="stat-trend" class="viz-chart"></div>
            </div>
          </div>
          <!-- Lys van studente wat tans ingeteken is -->
          <div class="card wide" id="dash-student-in-card" style="flex-direction:column;align-items:stretch">
            <strong>Studente tans ingeteken</strong>
            <div id="dash-student-in-list" class="admin-list" style="margin-top:8px"></div>
          </div>
          <!-- Lys van studente wat uitgeteken is -->
          <div class="card wide" id="dash-student-out-card" style="flex-direction:column;align-items:stretch">
            <strong>Studente uitgeteken</strong>
            <div id="dash-student-out-list" class="admin-list" style="margin-top:8px"></div>
          </div>
        </div>
      </article>

      <!-- Regterkant: soekbare lys van die koshuis se studente -->
      <article class="glass-card panel" aria-label="Lys">
        <h2>Lys</h2>
        <!-- Soekblokkie vir die studente-lys -->
        <div class="list-search">
          <input class="glass-input" type="search" id="list-search"
                 aria-label="Soek in Lys" placeholder="Soek student...">
        </div>
        <!-- Hier word die studente se kaartjies gewys -->
        <div id="data-list" class="admin-list" aria-label="Student lys"></div>
      </article>
    </section>
  </main>

  <!-- Onderste balk met 'n knoppie om terug te gaan na die tuisblad -->
  <div class="action-bar">
    <button class="btn-outline" type="button"
            onclick="window.location.href='home.html'">← Terug</button>
  </div>

  <!-- Skripte: die kode wat die bladsy laat werk (laai in hierdie volgorde) -->
  <script src="website_api_calls.js"></script>
  <script src="main.js"></script>
  <script src="stats.js"></script>
  <script src="koshuis.js"></script>
</body>
</html>
