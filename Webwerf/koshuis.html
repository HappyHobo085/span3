<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Koshuis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="home.html" class="navbar-logo" aria-label="MOON">MOON</a>
    <a href="home.html">Tuis</a>
    <a href="kampus.html">Kampus</a>
    <a href="koshuis.html" class="active">Koshuis</a>
    <a href="events.html">Events</a>
  </nav>

  <main class="page" id="home-page">
    <section class="top-controls" aria-label="Opsies">
      <div class="control-group">
        <label class="field-label" for="data-select">Kies Koshuis</label>
        <select class="glass-select" id="data-select" name="data-select" style="width:220px">
          <option value="veritas">Veritas</option>
          <option value="patria">Patria</option>
          <option value="heide">Heide</option>
          <option value="wagnbietjie">Wag-'n-Bietjie</option>
          <option value="kasteel">Kasteel</option>
        </select>
      </div>
    </section>

    <section class="panels">
      <article class="glass-card panel" aria-label="Dashboard">
        <h2>Dashboard</h2>
        <div class="dashboard-grid">
          <div class="card">Totale gebruikers</div>
          <div class="card">Aktiewe sessies</div>
          <div class="card mock-circle-card">
            <div class="mock-circle" aria-label="Mock circle diagram"></div>
          </div>
          <div class="card mock-graph-card" aria-label="Mock graph">
            <div class="mock-graph">
              <span class="bar bar-1"></span>
              <span class="bar bar-2"></span>
              <span class="bar bar-3"></span>
              <span class="bar bar-4"></span>
              <span class="bar bar-5"></span>
            </div>
          </div>
          <div class="card wide">Toegang oorsig</div>
        </div>
      </article>

      <article class="glass-card panel" aria-label="Lys">
        <h2>Lys</h2>
        <div class="list-search">
          <input class="glass-input" type="search" id="list-search"
                 aria-label="Soek in Lys" placeholder="Soek student...">
        </div>
        <ul id="data-list" class="empty-list" aria-label="Leë data lys"></ul>
      </article>
    </section>
  </main>

  <div class="action-bar">
    <button class="btn-outline" type="button"
            onclick="window.location.href='home.html'">← Terug</button>
  </div>

  <script>
    (function () {
      const listSearch = document.getElementById('list-search');
      const dataList   = document.getElementById('data-list');
      function applyListFilter() {
        if (!listSearch || !dataList) return;
        const query = listSearch.value.trim().toLowerCase();
        dataList.querySelectorAll('li').forEach((li) => {
          li.hidden = query !== '' && !(li.textContent || '').trim().toLowerCase().includes(query);
        });
      }
      if (listSearch) listSearch.addEventListener('input', applyListFilter);
    })();
  </script>
  <script src="main.js"></script>
</body>
</html>
