<!-- koshuis.html — Die Koshuis-bladsy. Wys wie tans by die koshuis in- en uitgeteken is, die besetting teenoor die kapasiteit, en 'n soekbare tabel van die koshuis se inwoners. -->
<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Koshuis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261007verslag">
  <script src="theme.js?v=20260819"></script>
</head>
<body>
  <!-- Gedeelde raamwerk: sybalk + boonste balk -->
  <div id="site-header"></div>

  <main class="page" id="koshuis-page">
    <!-- Boonste beheer: keuselys om 'n koshuis te kies (word deur koshuis.js ingevul) -->
    <section class="top-controls space-between" aria-label="Opsies">
      <div class="control-group">
        <label class="field-label" for="data-select">Kies Koshuis</label>
        <select class="glass-select" id="data-select" name="data-select" style="width:220px"></select>
      </div>
      <span class="live-chip"><span class="live-dot" aria-hidden="true"></span>Regstreeks · elke 5s</span>
    </section>

    <!-- KPI-teëls: die koshuis se tellings -->
    <div class="stat-grid dash-kpi" aria-label="Koshuis tellings">
      <div class="glass-card stat-card">
        <span class="stat-accent" aria-hidden="true" style="background:var(--series-1)"></span>
        <div class="stat-label">Studente ingeteken</div>
        <div class="stat-value" id="dash-student-in-count">--</div>
      </div>
      <div class="glass-card stat-card">
        <span class="stat-accent" aria-hidden="true" style="background:var(--series-2)"></span>
        <div class="stat-label">Studente uitgeteken</div>
        <div class="stat-value" id="dash-student-out-count">--</div>
      </div>
      <div class="glass-card stat-card">
        <span class="stat-accent" aria-hidden="true" style="background:var(--viz-dim)"></span>
        <div class="stat-label">Nog nooit gescan</div>
        <div class="stat-value" id="dash-nooit-count">--</div>
      </div>
      <div class="glass-card stat-card">
        <span class="stat-accent" aria-hidden="true"></span>
        <div class="stat-label">Inwoners / Kapasiteit</div>
        <div class="stat-value" id="dash-kapasiteit-card">--</div>
      </div>
    </div>

    <!-- Grafieke: sirkeldiagramme vir status en besetting, en die regstreekse tendens -->
    <section class="dash-grafieke" aria-label="Statistieke">
      <article class="glass-card panel dash-grafiek">
        <h2>Inwoners in / uit</h2>
        <div id="stat-inuit-donut" class="viz-chart"></div>
      </article>
      <article class="glass-card panel dash-grafiek">
        <h2>Besetting</h2>
        <div id="stat-besetting-donut" class="viz-chart"></div>
        <p class="viz-caption" id="besetting-nota" style="margin-top:10px"></p>
      </article>
    </section>
    <article class="glass-card panel dash-grafiek">
      <h2>Studente ingeteken oor tyd <span class="panel-count">regstreeks</span></h2>
      <div id="stat-trend" class="viz-chart"></div>
    </article>

    <!-- Inwoners: soekbare tabel met elkeen se status -->
    <article class="glass-card panel" aria-label="Inwoners">
      <h2>Inwoners van hierdie koshuis <span class="panel-count" id="inwoner-telling"></span></h2>
      <div id="inwoner-tabel"></div>
    </article>
  </main>

  <!-- Skripte: die kode wat die bladsy laat werk (laai in hierdie volgorde) -->
  <script src="website_api_calls.js?v=20261007verslag"></script>
  <script src="main.js?v=20261007verslag"></script>
  <script src="stats.js?v=20261007dash"></script>
  <script src="koshuis.js?v=20261007dash"></script>
</body>
</html>
