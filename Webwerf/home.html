<!DOCTYPE html>
<!--
  home.html — Tuisblad: wys 'n opsomming van die stelsel (kampusse, koshuise
  en gebeure) en 'n lys van die nuutste stelsel-opdaterings.
-->
<html lang="en">
<!-- Kop: die blad se titel, lettertipes en styl-lêer -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Tuis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260818b">
  <script src="theme.js"></script>
</head>
<body>
  <!-- Shared header placeholder -->
  <div id="site-header"></div>

  <!-- Hoofinhoud van die tuisblad -->
  <main class="page" id="home-page">
    <!-- Opsomming-blokkies: hoeveel kampusse, koshuise en gebeure daar is -->
    <div class="stat-grid" aria-label="Opsomming">
      <div class="glass-card stat-card">
        <div class="stat-label">Kampusse</div>
        <div class="stat-value">3</div>
        <div class="stat-sub">● Aktief</div>
        <div class="stat-bar"><div class="stat-bar-fill" style="width:60%"></div></div>
      </div>
      <div class="glass-card stat-card">
        <div class="stat-label">Koshuise</div>
        <div class="stat-value">12</div>
        <div class="stat-sub" style="color:var(--accent-2)">● Geregistreer</div>
        <div class="stat-bar"><div class="stat-bar-fill" style="width:80%"></div></div>
      </div>
      <div class="glass-card stat-card">
        <div class="stat-label">Gebeure (Events)</div>
        <div class="stat-value">5</div>
        <div class="stat-sub" style="color:var(--warning)">● Komende</div>
        <div class="stat-bar"><div class="stat-bar-fill" style="width:40%"></div></div>
      </div>
    </div>

    <!-- Lys van die nuutste stelsel-opdaterings -->
    <div class="glass-card" style="padding:20px">
      <div class="section-label">Stelsel Opdaterings</div>
      <ul class="updates-list" aria-label="Stelsel Opdaterings">
        <li><span class="updates-dot"></span>Toegangsbestuur module is aanlyn.</li>
        <li><span class="updates-dot" style="background:var(--success)"></span>Koshuis data is suksesvol gelaai vir 2026.</li>
        <li><span class="updates-dot" style="background:var(--accent-2)"></span>Nuwe studente kaarte is gedruk vir eerstejaars.</li>
      </ul>
    </div>
  </main>

  <!-- Skrip: kyk of die gebruiker ingeteken is en laat die "Teken Uit" knoppie werk -->
  <script src="main.js"></script>
</body>
</html>
