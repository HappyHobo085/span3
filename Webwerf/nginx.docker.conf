server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /login.html;
    }

    location /assets/ {
        alias /usr/share/nginx/assets/;
    }

    location / {
        try_files $uri $uri/ =404;
        # Blaaiers moet elke keer by die bediener bevestig dat die lêer nog
        # dieselfde is (304 as onveranderd) — keer dat ou JS/CSS vassteek.
        add_header Cache-Control "no-cache";
    }
}
