<!DOCTYPE html>
<!--
  Webwerf — Sub-system (module) overview.
  Module dropdown can be filled from localStorage (see login.js test data).
  Includes a static calendar preview in the right column.
-->
<!-- This tells the browser to use modern HTML5 mode -->
<html lang="en">
<!-- Start of the page head (settings and linked files) -->

<head>
    <!-- Character set so text displays correctly -->
    <meta charset="UTF-8">
    <!-- Makes the layout responsive on phones/tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Browser tab title -->
    <title>Twee Panele Webwerf</title>
    <!-- Main external stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<!-- Start of visible page content -->

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="home.html">Tuis</a>
        <a href="kampus.html">Kampus</a>
        <a href="koshuis.html">Koshuis</a>
        <a href="events.html">Events</a>
        <a href="sub_stelsel.html">Sub Stelsel</a>
    </nav>

    <main class="page" id="home-page">
        <!-- Filled by script from localStorage if testSubDetails exists -->
        <section class="top-controls" aria-label="Opsies">
            <label for="data-select">Kies module:</label>
            <select id="data-select" name="data-select">
            </select>
        </section>

        <!-- Two-panel main layout -->
        <section class="panels">
            <article class="panel left-panel" aria-label="Mock dashboard">
                <h2>Dashboard</h2>
                <div class="dashboard-grid">
                    <div class="card">Totale gebruikers</div>
                    <div class="card">Aktiewe sessies</div>
                    <div class="card mock-circle-card">
                        <div class="mock-circle" aria-label="Mock circle diagram"></div>
                    </div>
                    <div class="card mock-graph-card" aria-label="Mock graph">
                        <div class="mock-graph">
                            <span class="bar bar-1"></span>
                            <span class="bar bar-2"></span>
                            <span class="bar bar-3"></span>
                            <span class="bar bar-4"></span>
                            <span class="bar bar-5"></span>
                        </div>
                    </div>
                    <div class="card wide">Toegang oorsig</div>
                </div>
            </article>

            <article class="panel right-panel" aria-label="Leë lys">
                <h2>Lys</h2>
                <div class="list-search">
                    <input type="search" id="list-search" aria-label="Soek in Lys" placeholder="Soek student...">
                </div>
                <ul id="data-list" class="empty-list" aria-label="Leë data lys">
                </ul>

                <!-- Static month view: weekdays, then 7-column date cells (classes in styles.css) -->
                <div class="calendar-panel empty-list" aria-label="Kalender">
                    <h3 class="calendar-title">Mei 2026</h3>
                    <div class="calendar-grid">
                        <!-- Row 1: Sunday–Saturday letters -->
                        <div class="calendar-weekday">S</div>
                        <div class="calendar-weekday">M</div>
                        <div class="calendar-weekday">D</div>
                        <div class="calendar-weekday">W</div>
                        <div class="calendar-weekday">D</div>
                        <div class="calendar-weekday">V</div>
                        <div class="calendar-weekday">S</div>

                        <!-- Tail of previous month (grey) -->
                        <div class="calendar-muted">26</div>
                        <div class="calendar-muted">27</div>
                        <div class="calendar-muted">28</div>
                        <div class="calendar-muted">29</div>
                        <div class="calendar-muted">30</div>
                        <div>1</div>
                        <div>2</div>

                        <div>3</div>
                        <div>4</div>
                        <div>5</div>
                        <!-- Example “selected” day -->
                        <div class="calendar-day-selected">6</div>
                        <div>7</div>
                        <div>8</div>
                        <div>9</div>

                        <div>10</div>
                        <div>11</div>
                        <div>12</div>
                        <div>13</div>
                        <div>14</div>
                        <div>15</div>
                        <div>16</div>

                        <div>17</div>
                        <div>18</div>
                        <div>19</div>
                        <div>20</div>
                        <div>21</div>
                        <div>22</div>
                        <div>23</div>

                        <div>24</div>
                        <div>25</div>
                        <div>26</div>
                        <div>27</div>
                        <div>28</div>
                        <div>29</div>
                        <div>30</div>

                        <div>31</div>
                        <!-- Start of next month (grey) -->
                        <div class="calendar-muted">1</div>
                        <div class="calendar-muted">2</div>
                        <div class="calendar-muted">3</div>
                        <div class="calendar-muted">4</div>
                        <div class="calendar-muted">5</div>
                        <div class="calendar-muted">6</div>
                    </div>
                </div>
            </article>
        </section>

        <button class="action-button back-button" type="button" onclick="window.location.href='home.html'">Terug</button>
    </main>

    <!-- List filter + optional dropdown fill from demo localStorage -->
    <script>
        (function () {
            const listSearch = document.getElementById('list-search');
            const dataList = document.getElementById('data-list');

            function applyListFilter() {
                if (!listSearch || !dataList) return;
                const query = listSearch.value.trim().toLowerCase();
                const items = dataList.querySelectorAll('li');

                items.forEach((li) => {
                    const text = (li.textContent || '').trim().toLowerCase();
                    const matches = query === '' || text.includes(query);
                    li.hidden = !matches;
                });
            }

            if (listSearch) {
                listSearch.addEventListener('input', applyListFilter);
            }

            // login.js writes JSON under 'testSubDetails' for this demo dropdown
            const storedSub = localStorage.getItem('testSubDetails');
            if (storedSub) {
                const subDetails = JSON.parse(storedSub);
                const selectEl = document.getElementById('data-select');
                if (selectEl) {
                    const opt = document.createElement('option');
                    opt.value = subDetails.module;
                    opt.textContent = subDetails.module + " (" + subDetails.status + ")";
                    selectEl.appendChild(opt);
                }
            }
        })();
    </script>
    <script src="main.js"></script>
</body>

</html>
