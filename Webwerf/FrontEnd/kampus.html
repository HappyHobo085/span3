<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Kampus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="home.html" class="navbar-logo" aria-label="MOON">MOON</a>
    <a href="home.html">Tuis</a>
    <a href="kampus.html" class="active">Kampus</a>
    <a href="koshuis.html">Koshuis</a>
    <a href="events.html">Events</a>
  </nav>

  <main class="page" id="home-page">
    <!-- Top controls: campus select left, new-class button right -->
    <section class="top-controls space-between" aria-label="Opsies">
      <div class="control-group">
        <label class="field-label" for="data-select">Kies Kampus</label>
        <select class="glass-select" id="data-select" name="data-select" style="width:220px">
          <option value="potchefstroom">Potchefstroom</option>
          <option value="vanderbijlpark">Vanderbijlpark</option>
          <option value="mahikeng">Mahikeng</option>
        </select>
      </div>
      <button class="btn-primary" id="open-class-modal" type="button">+ Skep nuwe klas</button>
    </section>

    <!-- Two-panel layout -->
    <section class="panels">
      <!-- Left: mock dashboard -->
      <article class="glass-card panel" aria-label="Dashboard">
        <h2>Dashboard</h2>
        <div class="dashboard-grid">
          <div class="card">Totale gebruikers</div>
          <div class="card">Aktiewe sessies</div>
          <div class="card mock-circle-card">
            <div class="mock-circle" aria-label="Mock circle diagram"></div>
          </div>
          <div class="card mock-graph-card" aria-label="Mock graph">
            <div class="mock-graph">
              <span class="bar bar-1"></span>
              <span class="bar bar-2"></span>
              <span class="bar bar-3"></span>
              <span class="bar bar-4"></span>
              <span class="bar bar-5"></span>
            </div>
          </div>
          <div class="card wide">Toegang oorsig</div>
        </div>
      </article>

      <!-- Right: searchable list -->
      <article class="glass-card panel" aria-label="Lys">
        <h2>Lys</h2>
        <div class="list-search">
          <input class="glass-input" type="search" id="list-search"
                 aria-label="Soek in Lys" placeholder="Soek student...">
        </div>
        <ul id="data-list" class="empty-list" aria-label="Leë data lys"></ul>

        <div class="list-search list-search--spaced">
          <input class="glass-input" type="search" id="bottom-search"
                 aria-label="Soek dosent" placeholder="Soek dosent...">
        </div>
        <div class="bottom-inner-panel" aria-label="Verdere inligting"></div>
      </article>
    </section>
  </main>

  <div class="action-bar">
    <button class="btn-outline" type="button"
            onclick="window.location.href='home.html'">← Terug</button>
    <div class="action-bar-right">
      <button class="btn-outline btn-danger" type="button">Verwyder gebruiker</button>
      <button class="btn-primary" type="button">Skep nuwe gebruiker</button>
    </div>
  </div>

  <!-- "Skep nuwe klas" modal — toggled by kampus.js via .open class -->
  <div id="class-modal-overlay" class="class-modal-overlay" aria-hidden="true">
    <div class="class-modal" role="dialog" aria-modal="true" aria-labelledby="class-modal-title">
      <h3 id="class-modal-title">Skep nuwe klas</h3>
      <div class="field">
        <label for="class-room-name">Naam van klaskamer</label>
        <input id="class-room-name" type="text" placeholder="Voer die klaskamer naam in">
      </div>
      <div class="field">
        <label for="class-kampus">Kies kampus</label>
        <select id="class-kampus">
          <option value="">Kies kampus...</option>
        </select>
      </div>
      <div class="class-modal-actions">
        <button class="btn-outline" id="close-class-modal" type="button">Kanselleer</button>
        <button class="btn-primary" id="create-class-button" type="button">Skep</button>
      </div>
    </div>
  </div>

  <script src="website_api_calls.js"></script>
  <script src="main.js"></script>
  <script src="kampus.js"></script>
</body>
</html>
