<!DOCTYPE html>
<!--
  Webwerf — Kampus (campus) admin view.
  Loads campus list from the API into the dropdown (see kampus.js + website_api_calls.js).
  “Skep nuwe klas” opens a modal; submitting posts a new class to the backend.
-->
<!-- This tells the browser to use modern HTML5 mode -->
<html lang="en">
<!-- Start of the page head (settings and linked files) -->

<head>
  <!-- Character set so text displays correctly -->
  <meta charset="UTF-8">
  <!-- Makes the layout responsive on phones/tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Browser tab title -->
  <title>Twee Panele Webwerf</title>
  <!-- Kampus-specific layout (modal, top row) lives in styles.css -->
  <link rel="stylesheet" href="styles.css">
</head>
<!-- Start of visible page content -->

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="home.html">Tuis</a>
        <a href="kampus.html">Kampus</a>
        <a href="koshuis.html">Koshuis</a>
        <a href="events.html">Events</a>
        <a href="sub_stelsel.html">Sub Stelsel</a>
    </nav>

    <main class="page" id="home-page">
        <!-- Top row: campus select (left) + open modal button (right) -->
        <section class="top-controls kampus-controls" aria-label="Opsies">
            <div class="left-control">
              <label for="data-select">Kies Kampus:</label>
              <!-- Options replaced by API when available; these are fallbacks -->
              <select id="data-select" name="data-select">
                  <option value="potchefstroom">Potchefstroom</option>
                  <option value="vanderbijlpark">Vanderbijlpark</option>
                  <option value="mahikeng">Mahikeng</option>
              </select>
            </div>
            <button id="open-class-modal" class="create-class-button" type="button">Skep nuwe klas</button>
        </section>

    <!-- Two-panel main layout -->
    <section class="panels">
      <article class="panel left-panel" aria-label="Mock dashboard">
        <h2>Dashboard</h2>
        <div class="dashboard-grid">
          <div class="card">Totale gebruikers</div>
          <div class="card">Aktiewe sessies</div>
          <div class="card mock-circle-card">
            <div class="mock-circle" aria-label="Mock circle diagram"></div>
          </div>
          <div class="card mock-graph-card" aria-label="Mock graph">
            <div class="mock-graph">
              <span class="bar bar-1"></span>
              <span class="bar bar-2"></span>
              <span class="bar bar-3"></span>
              <span class="bar bar-4"></span>
              <span class="bar bar-5"></span>
            </div>
          </div>
          <div class="card wide">Toegang oorsig</div>
        </div>
      </article>

      <article class="panel right-panel" aria-label="Leë lys">
        <h2>Lys</h2>
        <div class="list-search">
          <input type="search" id="list-search" aria-label="Soek in Lys" placeholder="Soek student...">
        </div>
        <ul id="data-list" class="empty-list" aria-label="Leë data lys">
        </ul>

        <!-- Second search row (styling: list-search--spaced in CSS) -->
        <div class="list-search list-search--spaced">
          <input type="search" id="bottom-search" aria-label="Bottom Soek" placeholder="Soek dosent...">
        </div>

        <!-- Empty inner panel reserved for future content -->
        <div class="panel bottom-inner-panel bottom-inner-panel--kampus">
        </div>
      </article>
    </section>

    <button class="action-button back-button" type="button" onclick="window.location.href='home.html'">Terug</button>
    <div class="bottom-right-actions">
      <button class="action-button delete-button" type="button">Verwyder gebruiker</button>
      <button class="action-button generate-button" type="button">skep nuwe gebruiker</button>
    </div>
  </main>

  <!--
    Modal dialog (hidden until .open is toggled on the overlay).
    Field labels in the UI are Afrikaans; IDs are used by kampus.js.
  -->
  <div id="class-modal-overlay" class="class-modal-overlay" aria-hidden="true">
    <div class="class-modal" role="dialog" aria-modal="true" aria-labelledby="class-modal-title">
      <h3 id="class-modal-title">Skep nuwe klas</h3>

      <div class="field">
        <label for="class-room-name">Naam van kampus</label>
        <input id="class-room-name" type="text" placeholder="Voer die kampus naam in">
      </div>

      <div class="field">
        <label for="class-description">Naam van klas</label>
        <textarea id="class-description" placeholder="Voer die klas naam in"></textarea>
      </div>

      <div class="field">
        <label for="class-nfc-tag">Beskrywing</label>
        <input id="class-nfc-tag" type="text" placeholder="Voer die beskrywing in">
      </div>

      <div class="class-modal-actions">
        <button id="close-class-modal" type="button">Kanselleer</button>
        <button id="create-class-button" type="button">Skep</button>
      </div>
    </div>
  </div>

  <!-- main.js injects website_api_calls.js (MoonApi), then kampus.js runs page logic -->
  <script src="main.js"></script>
  <script src="kampus.js"></script>
</body>

</html>
