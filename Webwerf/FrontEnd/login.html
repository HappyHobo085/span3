<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Teken In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login-page" aria-label="Login page">
    <div class="login-container">
      <div class="login-logo">
        <div class="login-logo-text">MOON</div>
        <div class="login-logo-sub">Kampus Bestuur Stelsel</div>
      </div>
      <div class="glass-card login-card">
        <form id="login-form">
          <div class="field">
            <label class="field-label" for="email">E-pos</label>
            <input class="glass-input" type="email" id="email" name="email"
                   placeholder="Voer u e-pos in" required>
          </div>
          <div class="field">
            <label class="field-label" for="password">Wagwoord</label>
            <input class="glass-input" type="password" id="password" name="password"
                   placeholder="Voer u wagwoord in" required>
          </div>
          <button class="btn-primary" type="submit">Teken In</button>
        </form>
      </div>
    </div>
  </section>
  <script src="login.js"></script>
</body>
</html>
