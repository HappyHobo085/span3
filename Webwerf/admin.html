<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Admin toegang: slegs admins -->
  <nav class="navbar">
    <a href="home.html" class="navbar-logo" aria-label="MOON">MOON</a>
    <a href="home.html">Tuis</a>
    <a href="kampus.html">Kampus</a>
    <a href="koshuis.html">Koshuis</a>
    <a href="events.html">Events</a>
    <a href="admin.html" class="active">Admin</a>
    <div class="navbar-right">
      <button class="btn-outline" type="button" onclick="logOut()">Teken Uit</button>
    </div>
  </nav>

  <main class="page" id="admin-page">
    <!-- Action bar top -->
    <section class="top-controls space-between" aria-label="Admin aksies">
      <div class="control-group" style="flex-direction:row;gap:10px">
        <button class="btn-primary" id="open-create-user-modal" type="button">+ Skep Gebruiker</button>
        <button class="btn-outline" id="upload-csv-btn" type="button">Oplaai CSV</button>
        <input type="file" id="csv-file-input" accept=".csv" style="display:none">
      </div>
      <div class="control-group" style="flex-direction:row;gap:10px">
        <button class="btn-primary" id="open-create-kampus-modal" type="button">+ Skep Kampus</button>
        <button class="btn-primary" id="open-create-venue-modal" type="button">+ Skep Lokaal</button>
        <button class="btn-primary" id="open-create-koshuis-modal" type="button">+ Skep Koshuis</button>
      </div>
    </section>

    <!-- Two-column layout: each column stacks panels independently -->
    <section class="panels">
      <div class="panel-column">
        <article class="glass-card panel" aria-label="Gebruikers">
          <h2>Gebruikers</h2>
          <div class="list-search" style="display:flex;gap:8px">
            <input class="glass-input" type="search" id="user-search"
                   aria-label="Soek gebruiker" placeholder="Soek gebruiker..." style="flex:1">
            <select class="glass-select" id="user-role-filter" aria-label="Filter volgens rol" style="width:160px">
              <option value="">Alle Rolle</option>
              <!-- Loaded from API by admin.js -->
            </select>
          </div>
          <div class="admin-list" id="user-list">
            <!-- Loaded from API by admin.js -->
          </div>
        </article>
        <article class="glass-card panel" aria-label="Kampusse">
          <h2>Kampusse</h2>
          <div class="list-search">
            <input class="glass-input" type="search" id="kampus-search"
                   aria-label="Soek kampus" placeholder="Soek kampus...">
          </div>
          <div class="admin-list" id="kampus-list">
            <!-- Loaded from API by admin.js -->
          </div>
        </article>
      </div>
      <div class="panel-column">
        <article class="glass-card panel" aria-label="Lokale">
          <h2>Lokale</h2>
          <div class="list-search" style="display:flex;gap:8px">
            <input class="glass-input" type="search" id="venue-search"
                   aria-label="Soek lokaal" placeholder="Soek lokaal..." style="flex:1">
            <select class="glass-select" id="venue-campus-filter" aria-label="Filter volgens kampus" style="width:160px">
              <option value="">Alle Kampusse</option>
              <!-- Loaded from API by admin.js -->
            </select>
          </div>
          <div class="admin-list" id="venue-list">
            <!-- Loaded from API by admin.js -->
          </div>
        </article>
        <article class="glass-card panel" aria-label="Koshuise">
          <h2>Koshuise</h2>
          <div class="list-search">
            <input class="glass-input" type="search" id="koshuis-search"
                   aria-label="Soek koshuis" placeholder="Soek koshuis...">
          </div>
          <div class="admin-list" id="koshuis-list">
            <!-- Loaded from API by admin.js -->
          </div>
        </article>
      </div>
    </section>
  </main>

  <div class="action-bar">
    <button class="btn-outline" type="button"
            onclick="window.location.href='home.html'">← Terug</button>
    <span></span>
  </div>

  <!-- Modal 1: Skep Gebruiker -->
  <div id="createUserModal" class="class-modal-overlay" aria-hidden="true">
    <div class="class-modal" role="dialog" aria-modal="true" aria-labelledby="create-user-title">
      <h3 id="create-user-title">Skep Gebruiker</h3>
      <div class="field">
        <label for="new-user-name">Naam</label>
        <input class="glass-input" id="new-user-name" type="text" placeholder="Voer naam in">
      </div>
      <div class="field">
        <label for="new-user-surname">Van</label>
        <input class="glass-input" id="new-user-surname" type="text" placeholder="Voer van in">
      </div>
      <div class="field">
        <label for="new-user-email">E-pos</label>
        <input class="glass-input" id="new-user-email" type="email" placeholder="Voer e-posadres in">
      </div>
      <div class="field" id="student-number-field" style="display:none">
        <label for="new-user-student-nr">Studentenommer</label>
        <input class="glass-input" id="new-user-student-nr" type="text" placeholder="Voer studentenommer in">
      </div>
      <div class="field">
        <label for="new-user-password">Wagwoord</label>
        <input class="glass-input" id="new-user-password" type="password" placeholder="Voer wagwoord in">
      </div>
      <div class="field">
        <label for="new-user-role">Rol</label>
        <select class="glass-select" id="new-user-role">
          <option value="">Kies rol...</option>
        </select>
      </div>
      <div class="class-modal-actions">
        <button class="btn-outline btn-danger" id="delete-user-btn" type="button"
                style="display:none;margin-right:auto">Verwyder</button>
        <button class="btn-outline" id="close-create-user-modal" type="button">Kanselleer</button>
        <button class="btn-primary" id="create-user-btn" type="button">Skep</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Bestuur Rolle -->
  <div id="roleModal" class="class-modal-overlay" aria-hidden="true">
    <div class="class-modal" role="dialog" aria-modal="true" aria-labelledby="role-modal-title">
      <h3 id="role-modal-title">Bestuur Rolle — <span id="role-modal-user-name">Gebruiker</span></h3>
      <div class="field">
        <label>Huidige Rolle</label>
        <div class="role-badges-container" id="current-roles">
          <span class="role-badge-removable role-badge--studente">studente <button class="role-badge-remove" type="button">&times;</button></span>
        </div>
      </div>
      <div class="field">
        <label for="add-role-select">Voeg Rol By</label>
        <div class="add-role-row">
          <select class="glass-select" id="add-role-select">
            <option value="">Kies rol...</option>
          </select>
          <button class="btn-primary btn-sm" id="add-role-btn" type="button">Voeg By</button>
        </div>
      </div>
      <div class="class-modal-actions">
        <button class="btn-primary" id="close-role-modal" type="button">Klaar</button>
      </div>
    </div>
  </div>

  <!-- Modal 3: Verander Wagwoord -->
  <div id="passwordModal" class="class-modal-overlay" aria-hidden="true">
    <div class="class-modal" role="dialog" aria-modal="true" aria-labelledby="password-modal-title">
      <h3 id="password-modal-title">Verander Wagwoord — <span id="password-modal-user-name">Gebruiker</span></h3>
      <div class="field">
        <label for="new-password">Nuwe Wagwoord</label>
        <input class="glass-input" id="new-password" type="password" placeholder="Voer nuwe wagwoord in">
      </div>
      <div class="field">
        <label for="confirm-password">Bevestig Wagwoord</label>
        <input class="glass-input" id="confirm-password" type="password" placeholder="Bevestig nuwe wagwoord">
      </div>
      <div class="class-modal-actions">
        <button class="btn-outline" id="close-password-modal" type="button">Kanselleer</button>
        <button class="btn-primary" id="change-password-btn" type="button">Verander</button>
      </div>
    </div>
  </div>

  <!-- Modal 4: Skep Kampus -->
  <div id="createKampusModal" class="class-modal-overlay" aria-hidden="true">
    <div class="class-modal" role="dialog" aria-modal="true" aria-labelledby="create-kampus-title">
      <h3 id="create-kampus-title">Skep Kampus</h3>
      <div class="field">
        <label for="new-kampus-name">Naam</label>
        <input class="glass-input" id="new-kampus-name" type="text" placeholder="Voer kampusnaam in">
      </div>
      <div class="class-modal-actions">
        <button class="btn-outline btn-danger" id="delete-kampus-btn" type="button"
                style="display:none;margin-right:auto">Verwyder</button>
        <button class="btn-outline" id="close-create-kampus-modal" type="button">Kanselleer</button>
        <button class="btn-primary" id="create-kampus-btn" type="button">Skep</button>
      </div>
    </div>
  </div>

  <!-- Modal 5: Skep Koshuis -->
  <div id="createKoshuisModal" class="class-modal-overlay" aria-hidden="true">
    <div class="class-modal" role="dialog" aria-modal="true" aria-labelledby="create-koshuis-title">
      <h3 id="create-koshuis-title">Skep Koshuis</h3>
      <div class="field">
        <label for="new-koshuis-name">Naam</label>
        <input class="glass-input" id="new-koshuis-name" type="text" placeholder="Voer koshuisnaam in">
      </div>
      <div class="field">
        <label for="new-koshuis-address">Adres</label>
        <input class="glass-input" id="new-koshuis-address" type="text" placeholder="Voer adres in">
      </div>
      <div class="field">
        <label for="new-koshuis-capacity">Kapasiteit</label>
        <input class="glass-input" id="new-koshuis-capacity" type="number" min="1" placeholder="Voer kapasiteit in">
      </div>
      <div class="field">
        <label for="new-koshuis-kampus">Kampus</label>
        <select class="glass-select" id="new-koshuis-kampus">
          <option value="">Kies kampus...</option>
        </select>
      </div>
      <div class="class-modal-actions">
        <button class="btn-outline btn-danger" id="delete-koshuis-btn" type="button"
                style="display:none;margin-right:auto">Verwyder</button>
        <button class="btn-outline" id="close-create-koshuis-modal" type="button">Kanselleer</button>
        <button class="btn-primary" id="create-koshuis-btn" type="button">Skep</button>
      </div>
    </div>
  </div>

    <!-- "Skep nuwe klas" modal — toggled by kampus.js via .open class -->
  <div id="class-modal-overlay" class="class-modal-overlay" aria-hidden="true">
    <div class="class-modal" role="dialog" aria-modal="true" aria-labelledby="class-modal-title">
      <h3 id="class-modal-title">Skep nuwe klas</h3>
      <div class="field">
        <label for="class-room-name">Naam van klaskamer</label>
        <input id="class-room-name" type="text" placeholder="Voer die klaskamer naam in">
      </div>
      <div class="field">
        <label for="class-kampus">Kies kampus</label>
        <select id="class-kampus">
          <option value="">Kies kampus...</option>
        </select>
      </div>
      <div class="class-modal-actions">
        <button class="btn-outline btn-danger" id="delete-lokaal-btn" type="button"
                style="display:none;margin-right:auto">Verwyder</button>
        <button class="btn-outline" id="close-class-modal" type="button">Kanselleer</button>
        <button class="btn-primary" id="create-class-button" type="button">Skep</button>
      </div>
    </div>
  </div>

  <script src="website_api_calls.js"></script>
  <script src="main.js"></script>
  <script src="admin.js"></script>
</body>
</html>
