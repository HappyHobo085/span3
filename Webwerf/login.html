<!DOCTYPE html>
<!--
  login.html — Inteken-blad: hier tik die gebruiker sy/haar e-pos en wagwoord in
  om by die MOON kampus-stelsel in te teken.
-->
<html lang="af">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — Teken In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260903c">
  <script src="theme.js?v=20260819"></script>
</head>
<body>
  <!-- Inteken-afdeling: die maan-merk en die inteken-vorm -->
  <section id="login-page" aria-label="Teken in">
    <div class="login-container">
      <!-- Merk en naam van die stelsel -->
      <div class="login-logo">
        <img class="login-logo-img" src="assets/MOON-logo.png" alt="MOON — Altyd waaksaam, altyd veilig" style="display:block;width:100%;max-width:300px;height:auto;margin:0 auto">
        <div class="login-logo-sub">Kampus Bestuur Stelsel</div>
      </div>
      <!-- Inteken-vorm: e-pos, wagwoord en die "Teken In" knoppie -->
      <div class="glass-card login-card">
        <!-- Boodskappe (bv. sessie verval, verkeerde wagwoord) -->
        <p id="login-boodskap" class="modal-status" aria-live="polite" style="margin:0 0 14px"></p>
        <form id="login-form">
          <div class="field">
            <label class="field-label" for="email">E-pos</label>
            <input class="glass-input" type="email" id="email" name="email"
                   placeholder="Voer u e-pos in" autocomplete="username" required>
          </div>
          <div class="field">
            <label class="field-label" for="password">Wagwoord</label>
            <input class="glass-input" type="password" id="password" name="password"
                   placeholder="Voer u wagwoord in" autocomplete="current-password" required>
          </div>
          <button class="btn-primary" type="submit">Teken In</button>
        </form>
      </div>
      <div class="login-foot">Studente gebruik die Moon app</div>
    </div>
  </section>
  <!-- Skrip: die kode wat die inteken laat werk -->
  <script src="website_api_calls.js?v=20260902b"></script>
  <script src="login.js?v=20260902b"></script>
</body>
</html>
