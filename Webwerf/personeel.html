<!DOCTYPE html>
<html lang="af">
<!-- personeel.html — Die "My Klasse" bladsy vir personeel: wys klasbywoning,
     'n kalender en die klasregister. Die klasse en die klasregister kom van die
     bediener (/rooster-roetes); die logika sit in personeel.js. -->
<!-- Kop-gedeelte: bladsy-titel, lettertipe en die styl-lêer word hier gelaai -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — My Klasse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260903d">
  <script src="theme.js?v=20260819"></script>
</head>
<!-- personeel-blad: die bladsy self blaai nie; net die lyste in die panele blaai -->
<body class="personeel-blad">
  <!-- Personeel toegang: slegs Personeel-rol (hek in main.js) -->
  <!-- Gedeelde raamwerk: sybalk + boonste balk -->
  <div id="site-header"></div>

  <main class="page" id="personeel-page">
    <!-- Boonste beheer: kies 'n klas en sien watter datum tans gekies is -->
    <section class="top-controls space-between" aria-label="Opsies">
      <div class="control-group">
        <label class="field-label" for="klas-select">Kies Klas</label>
        <select class="glass-select" id="klas-select" name="klas-select" style="width:260px"></select>
      </div>
      <div class="control-group">
        <span class="field-label">Gekose Datum</span>
        <span id="dash-datum" style="font-family:var(--font-mono);font-size:14px;font-weight:600">--</span>
      </div>
    </section>

    <!-- KPI-teëls: die gekose dag se bywoning -->
    <div class="stat-grid" aria-label="Bywoning tellings">
      <div class="glass-card stat-card">
        <span class="stat-accent" aria-hidden="true" style="background:var(--series-1)"></span>
        <div class="stat-label">Ingeskandeer</div>
        <div class="stat-value" id="dash-in-count">--</div>
      </div>
      <div class="glass-card stat-card">
        <span class="stat-accent" aria-hidden="true" style="background:var(--error)"></span>
        <div class="stat-label">Nie ingeskandeer</div>
        <div class="stat-value" id="dash-out-count">--</div>
      </div>
      <div class="glass-card stat-card">
        <span class="stat-accent" aria-hidden="true"></span>
        <div class="stat-label">Totaal studente</div>
        <div class="stat-value" id="dash-total-count">--</div>
      </div>
      <!-- Bywoning as 'n persentasie-sirkel (stats.js: renderPercentRing) -->
      <div class="glass-card stat-card viz-ring-card" id="dash-percent-count">Bywoning: --</div>
    </div>

    <!-- Twee panele langs mekaar: links die bywoning, regs die kalender en klaslys -->
    <section class="panels">
      <!-- Links: bywoning dashboard -->
      <article class="glass-card panel" aria-label="Bywoning Dashboard">
        <h2>Klas Bywoning</h2>
        <div class="dashboard-grid">
          <!-- Statistieke: bywoning oor die laaste 10 klasdae (stats.js);
               klik op 'n kolom om daardie dag se bywoning te sien -->
          <div class="card wide viz-block" id="dash-stats-card">
            <strong>Bywoning — laaste 10 klasdae</strong>
            <div id="stat-bywoning-chart" class="viz-chart"></div>
            <div id="stat-bywoning-avg" class="viz-caption"></div>
          </div>
          <!-- Studente per module: elke student in die gekose klas se register
               met 'n vorderingsbalk van sy/haar bywoning vir hierdie module
               (laaste klasdae) en die gekose dag se status. Klik op 'n student
               om sy/haar bywoningstatistieke hieronder te sien. -->
          <div class="card wide viz-block" id="dash-module-card"
               style="flex-direction:column;align-items:stretch;justify-content:flex-start">
            <div class="module-list-kop">
              <strong id="module-student-titel">Studente — bywoning per module</strong>
              <span class="viz-caption" id="module-student-caption"></span>
            </div>
            <div id="module-student-list" class="admin-list module-student-list"
                 aria-label="Studente per module met bywoning"></div>
          </div>
          <!-- Studentbywoning: verskyn wanneer 'n student gekies word (links of in
               die klasregister regs); wys bygewoon vs gemis vir hierdie module -->
          <div class="card wide viz-block" id="dash-student-card" hidden>
            <strong id="student-stats-titel">Studentbywoning</strong>
            <div id="stat-student-split" class="viz-chart"></div>
            <div id="stat-student-caption" class="viz-caption"></div>
          </div>
        </div>
      </article>

      <!-- Regs: kalender + klasregister -->
      <article class="glass-card panel" aria-label="Kalender en Klasregister">
        <h2>Kalender</h2>
        <!-- Kalender: klik op 'n dag om daardie dag se bywoning te sien -->
        <div class="kalender">
          <div class="kalender-header">
            <button class="btn-outline btn-sm" id="kal-prev" type="button" aria-label="Vorige maand">&larr;</button>
            <div class="kalender-title" id="kal-title">--</div>
            <button class="btn-outline btn-sm" id="kal-next" type="button" aria-label="Volgende maand">&rarr;</button>
          </div>
          <div class="kalender-grid" id="kal-grid"></div>
        </div>

        <!-- Klasregister: volle klaslys met 'n soekblokkie -->
        <h2 style="margin-top:16px">Klasregister</h2>
        <div class="list-search">
          <input class="glass-input" type="search" id="roster-search"
                 aria-label="Soek student" placeholder="Soek student...">
        </div>
        <div id="roster-list" class="admin-list" aria-label="Klasregister lys"></div>
      </article>
    </section>
  </main>

  <!-- Skripte: website_api_calls.js (praat met die bediener; eksplisiet gelaai
       sodat MoonApi klaar bestaan wanneer personeel.js die klasse laai),
       main.js (aanmelding en toegang) en personeel.js (hierdie bladsy se logika) -->
  <script src="website_api_calls.js?v=20260902"></script>
  <script src="main.js?v=20260902"></script>
  <script src="stats.js?v=20260902"></script>
  <script src="personeel.js?v=20260903b"></script>
</body>
</html>
