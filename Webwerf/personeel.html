<!DOCTYPE html>
<html lang="af">
<!-- personeel.html — Die "My Klasse" bladsy vir personeel: wys klasbywoning,
     'n kalender en die klasregister. Die klasse en die klasregister kom van die
     bediener (/rooster-roetes); die logika sit in personeel.js. -->
<!-- Kop-gedeelte: bladsy-titel, lettertipe en die styl-lêer word hier gelaai -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON — My Klasse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261007personeel">
  <script src="theme.js?v=20260819"></script>
</head>
<body>
  <!-- Personeel toegang: slegs Personeel-rol (hek in main.js) -->
  <!-- Gedeelde raamwerk: sybalk + boonste balk -->
  <div id="site-header"></div>

  <main class="page" id="personeel-page">
    <!-- Boonste beheer: kies 'n klas en sien watter datum tans gekies is -->
    <section class="top-controls space-between" aria-label="Opsies">
      <div class="control-group">
        <label class="field-label" for="module-select">Kies Module</label>
        <select class="glass-select" id="module-select" name="module-select" style="width:260px"></select>
      </div>
      <div class="control-group">
        <label class="field-label" for="dag-select">Kies Dag</label>
        <select class="glass-select" id="dag-select" name="dag-select" style="width:260px"></select>
      </div>
      <div class="control-group">
        <span class="field-label">Gekose Datum</span>
        <span id="dash-datum" style="font-family:var(--font-mono);font-size:14px;font-weight:600">--</span>
      </div>
    </section>

    <!-- KPI-teëls: die gekose dag se bywoning -->
    <div class="stat-grid dash-kpi" aria-label="Bywoning tellings">
      <div class="glass-card stat-card">
        <span class="stat-accent" aria-hidden="true" style="background:var(--series-1)"></span>
        <div class="stat-label">Ingeskandeer</div>
        <div class="stat-value" id="dash-in-count">--</div>
      </div>
      <div class="glass-card stat-card">
        <span class="stat-accent" aria-hidden="true" style="background:var(--error)"></span>
        <div class="stat-label">Nie ingeskandeer</div>
        <div class="stat-value" id="dash-out-count">--</div>
      </div>
      <div class="glass-card stat-card">
        <span class="stat-accent" aria-hidden="true"></span>
        <div class="stat-label">Totaal studente</div>
        <div class="stat-value" id="dash-total-count">--</div>
      </div>
      <div class="glass-card stat-card">
        <span class="stat-accent" aria-hidden="true" style="background:var(--series-2)"></span>
        <div class="stat-label">Bywoning</div>
        <div class="stat-value" id="dash-percent-count">--</div>
      </div>
    </div>

    <!-- Grafieke: die gekose dag, die kalender en die gekose student -->
    <section class="dash-grafieke" aria-label="Statistieke">
      <article class="glass-card panel dash-grafiek">
        <h2>Gekose dag</h2>
        <div id="stat-dag-donut" class="viz-chart"></div>
        <p class="viz-caption" id="stat-dag-caption" style="margin-top:10px"></p>
      </article>
      <!-- Kalender: klik op 'n dag om daardie dag se bywoning te sien -->
      <article class="glass-card panel dash-grafiek" aria-label="Kalender">
        <h2>Kalender</h2>
        <div class="kalender">
          <div class="kalender-header">
            <button class="btn-outline btn-sm" id="kal-prev" type="button" aria-label="Vorige maand">&larr;</button>
            <div class="kalender-title" id="kal-title">--</div>
            <button class="btn-outline btn-sm" id="kal-next" type="button" aria-label="Volgende maand">&rarr;</button>
          </div>
          <div class="kalender-grid" id="kal-grid"></div>
        </div>
      </article>
      <!-- Studentbywoning: kies 'n student in die klasregister hieronder -->
      <article class="glass-card panel dash-grafiek" id="dash-student-card">
        <h2 id="student-stats-titel">Studentbywoning</h2>
        <div id="stat-student-donut" class="viz-chart"></div>
        <p class="viz-caption" id="stat-student-caption" style="margin-top:10px"></p>
      </article>
    </section>

    <!-- Bywoning oor die laaste 10 klasdae; klik op 'n kolom om daardie dag te kies -->
    <article class="glass-card panel dash-grafiek" id="dash-stats-card">
      <h2>Bywoning — laaste 10 klasdae</h2>
      <div id="stat-bywoning-chart" class="viz-chart"></div>
      <p class="viz-caption" id="stat-bywoning-avg" style="margin-top:10px"></p>
    </article>

    <!-- Klasregister: soekbare tabel met elke student se status en bywoning -->
    <article class="glass-card panel" aria-label="Klasregister">
      <h2 id="register-titel">Klasregister <span class="panel-count" id="register-telling"></span></h2>
      <div id="register-tabel"></div>
    </article>
  </main>

  <!-- Skripte: website_api_calls.js (praat met die bediener; eksplisiet gelaai
       sodat MoonApi klaar bestaan wanneer personeel.js die klasse laai),
       main.js (aanmelding en toegang) en personeel.js (hierdie bladsy se logika) -->
  <script src="website_api_calls.js?v=20261007verslag"></script>
  <script src="main.js?v=20261007verslag"></script>
  <script src="stats.js?v=20261007dash"></script>
  <script src="personeel.js?v=20261007dash"></script>
</body>
</html>
