version: '3.8'

services:
  webwerf-frontend:
    image: nginx:alpine
    container_name: webwerf_frontend
    ports:
      - "8080:80"
    volumes:
      # Mount the FrontEnd folder as the root of the website
      - ./FrontEnd:/usr/share/nginx/html:ro
      # Mount the assets folder so the browser can resolve ../assets/...
      - ./assets:/usr/share/nginx/assets:ro
    restart: unless-stopped
